name: Mobile — збірка Android APK

on:
  workflow_dispatch: {}
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"

jobs:
  build:
    name: flutter build apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      # Кожна збірка — нова версія. Major.minor беремо з pubspec.yaml, а
      # patch і versionCode — з наскрізного номера запуску цього воркфлоу:
      # він лише зростає, а Android ставить APK поверх наявного тільки тоді,
      # коли versionCode новіший (і підпис той самий — див. build.gradle.kts).
      - name: Номер версії
        id: version
        run: |
          base=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version: *//' | cut -d+ -f1)
          major_minor=$(echo "$base" | cut -d. -f1,2)
          echo "name=${major_minor}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "sha7=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: flutter build apk --release
        run: |
          flutter build apk --release \
            --build-name='${{ steps.version.outputs.name }}' \
            --build-number='${{ steps.version.outputs.code }}' \
            --dart-define=GIT_SHA=${{ github.sha }}

      # Ім'я файла містить версію й коміт — щоб на телефоні й у переписці було
      # видно, яка саме це збірка, ще до встановлення.
      - name: Назвати APK версією
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/ostvytsya-${{ steps.version.outputs.name }}-${{ steps.version.outputs.sha7 }}.apk"

      # Головна гарантія оновлення «поверх» без видалення застосунку: підпис
      # APK мусить збігатися з ключем, яким підписані попередні збірки. Тут ми
      # це не обіцяємо, а ПЕРЕВІРЯЄМО — зчитуємо відбиток сертифіката з
      # готового APK і порівнюємо з відбитком ключа, яким збірка мала
      # підписатися. Не збіглось — збірка падає, а не роз'їжджається тихо.
      # Відбиток ще й друкується в лог: його можна порівняти між будь-якими
      # двома збірками (і з тим, що показує телефон).
      - name: Перевірити підпис APK
        run: |
          set -euo pipefail
          apk=$(ls build/app/outputs/flutter-apk/ostvytsya-*.apk)
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          apksigner=$(ls "$sdk"/build-tools/*/apksigner | sort -V | tail -1)

          # Той самий вибір ключа, що й у android/app/build.gradle.kts.
          store="${ANDROID_KEYSTORE_FILE:-ostvytsya-shared.jks}"
          storepass="${ANDROID_KEYSTORE_PASSWORD:-android}"
          alias="${ANDROID_KEY_ALIAS:-ostvytsya}"

          fingerprint() { tr -d ': ' | tr 'A-F' 'a-f'; }
          expected=$(keytool -list -v -keystore "android/$store" \
                       -storepass "$storepass" -alias "$alias" \
                     | grep -m1 'SHA256:' | awk '{print $2}' | fingerprint)
          actual=$("$apksigner" verify --print-certs "$apk" \
                   | grep -m1 -i 'SHA-256 digest' | awk '{print $NF}' | fingerprint)

          echo "Ключ збірки:  $expected"
          echo "Підпис APK:   $actual"
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::APK підписано не тим ключем — оновлення поверх наявного застосунку не встановиться."
            exit 1
          fi
          echo "✅ Підпис стабільний: APK стане оновленням для попередніх збірок."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ostvytsya-quest-${{ steps.version.outputs.name }}
          path: mobile/build/app/outputs/flutter-apk/ostvytsya-*.apk
          if-no-files-found: error
