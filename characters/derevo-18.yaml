#      гравців, лише з людського роду загалом і з героїв своїх загадок.
#    • Три загадки про побут та історію Русі й України, віршем:
#        1) мед хмільний (медовуха) — напій княжих бенкетів і весіль;
#        2) вечорниці — зимові зібрання молоді;
#        3) дружина — і княже воїнство, і жінка (слово з двома значеннями).
# ─────────────────────────────────────────────────────────────────────────────

