#  Парк історичної реконструкції «Оствиця», Рівне  ·  гравці: ДОРОСЛІ (18+)
#
#  Клон Дерева (derevo.yaml) з ДОРОСЛИМ сценарієм. Оригінал лишено без змін —
#  це окремий персонаж із власним id; ставити на термінал лише тоді, коли
#  квест грає доросла компанія.
#
#  Той самий характер і манера: прадавній, мудрий, стомлений дух, що говорить
