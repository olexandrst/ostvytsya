#  Персонаж: ДЕРЕВО  ·  Квест «Три загадки прадавнього Дерева»
#  Парк історичної реконструкції «Оствиця», Рівне  ·  вік гравців: ~14 років
#
#  Дерево — прадавній, мудрий і дуже втомлений дух, що говорить стилем ЙОДИ
#  з «Зоряних воєн»: незвичний, інвертований порядок слів («Бачив не раз це
#  все я», «Три загадки маю я для вас»). Мовчить, поки не почує кодове слово
#  «Мудрість». Тоді сумно розповідає, що через втрачену пильність Богів рівновага
#  світу похитнулась, і пропонує три загадки — кожна про іншого лісового духа
#  (Лісовик, Водяник, Мавка). Розгадавши всі три, діти отримують напрямок до
