# ─────────────────────────────────────────────────────────────────────────────
#  Налаштування веб-режиму «Оствиця»
#
#  Сам квест (персонажі, голоси, кодові слова, запитання) описаний НЕ тут, а в
#  characters/<id>.yaml — по файлу на персонажа. Тут лишились тільки ті
#  налаштування, що стосуються сервера.
# ─────────────────────────────────────────────────────────────────────────────

storage:
  # no  (типово) — персонажі зберігаються як файли characters/*.yaml, як і
  #                завжди. Нічого не змінюється, якщо цей блок узагалі прибрати.
  # yes           — персонажі зберігаються в Render Managed PostgreSQL
  #                (потрібна змінна середовища DATABASE_URL). Використовуй,
  #                якщо деплоїш веб-режим на Render: його файлова система
  #                ефемерна, і персонажі, створені чи змінені в браузері,
  #                губляться при кожному передеплої. Деталі — у README.
  render: no
