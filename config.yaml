# ─────────────────────────────────────────────────────────────────────────────
#  Глобальна конфігурація рантайму квест-агента «Оствиця».
#  Тут — налаштування заліза/моделі. Сам сценарій персонажа — у characters/*.yaml
#  Будь-що нижче можна перевизначити аргументами CLI (див. README).
# ─────────────────────────────────────────────────────────────────────────────

# Який персонаж (сценарій) запускати за замовчуванням.
character_file: "characters/domovychok.yaml"

gemini:
  # Звідки брати ключ API (назва змінної середовища).
  api_key_env: "GEMINI_API_KEY"
  # Модель Gemini Native Audio. Перевір актуальний ID у README/документації.
  # Альтернативи: gemini-2.5-flash-native-audio-preview-12-2025,
  #               gemini-2.5-flash-preview-native-audio-dialog
  model: "gemini-2.5-flash-native-audio-preview-09-2025"
  api_version: "v1beta"

audio:
  # null = системний пристрій за замовчуванням. Можна вказати індекс (int)
  # або частину назви пристрою (рядок). Список: python -m domovyk_quest --list-devices
  input_device: null
  output_device: null
  input_sample_rate: 16000     # Gemini Live приймає вхід 16 кГц PCM16 моно
  output_sample_rate: 24000    # Gemini Live віддає вихід 24 кГц PCM16 моно
  input_block_ms: 32           # розмір аудіоблоку з мікрофона
  vad_rms_threshold: 350       # поріг гучності, щоб вважати, що гравець говорить

wake:
  # Як ловити кодове слово в режимі спокою:
  #   vosk   — офлайн локально (рекомендовано: тихо, без витрат, приватно)
  #   gemini — через Gemini Live (без зайвих залежностей, але стрімить у хмару)
  #   manual — натиснути Enter (для розробки/тесту без мікрофона)
  mode: "vosk"
  vosk_model_path: "models/vosk-model-small-uk"
  fuzzy: true                  # приймати близькі за звучанням варіанти
  fuzzy_threshold: 0.78        # 0..1, наскільки близько має збігтися слово

session:
  inactivity_timeout_s: 45     # тиша гравця довше цього → засинаємо
  max_duration_s: 300          # запобіжник: максимальна тривалість квесту
  cooldown_s: 3                # пауза між квестами перед поверненням у спокій
  greeting_on_wake: true       # одразу вітатися після пробудження

logging:
  level: "INFO"                # DEBUG | INFO | WARNING | ERROR
  transcript: true             # друкувати в консоль розшифровку діалогу
