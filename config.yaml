# ─────────────────────────────────────────────────────────────────────────────
#  Налаштування веб-режиму «Оствиця»
#
#  Сам квест (персонажі, голоси, кодові слова, запитання) описаний НЕ тут, а в
#  characters/<id>.yaml — по файлу на персонажа. Тут лишились тільки ті
#  налаштування, що стосуються сервера.
# ─────────────────────────────────────────────────────────────────────────────

storage:
  # Де веб-панель зберігає персонажів редактора:
  #   sqlite     (типово) — таблиця в спільній базі панелі data/ostvytsya.db
  #                         (шлях: OSTVYTSYA_DB_PATH). Там же живуть статуси
  #                         терміналів, персонажі з телефонів і адміністратор.
  #                         При першому старті персонажі з characters/*.yaml
  #                         імпортуються в базу автоматично.
  #   files               — characters/*.yaml, як було спочатку (зручно для
  #                         авторства сценаріїв прямо в репозиторії).
  #   postgresql          — Render Managed PostgreSQL (змінна DATABASE_URL) —
  #                         для хостингів без постійного диска.
  # Те саме можна задати змінною середовища OSTVYTSYA_STORAGE_BACKEND.
  backend: sqlite
  # Старий прапорець (render: yes ⇒ postgresql) — лишено для сумісності.
  render: no
