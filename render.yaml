# ─────────────────────────────────────────────────────────────────────────────
#  Деплой веб-панелі на Render (https://render.com) — Blueprint.
#
#  Render → New → Blueprint → обрати цей репозиторій → Apply: сервіс, диск і
#  змінні створяться з цього файлу. Покрокова інструкція — README, розділ
#  «Деплой на Render».
#
#  ‼️ ПОСТІЙНИЙ ДИСК. Диск Render ефемерний: усе, що сервіс записав у свою
#  теку, зникає при кожному деплої та перезапуску. База панелі — один файл
#  SQLite (адміністратор, персонажі з телефонів, персонажі редактора, статуси
#  терміналів, перемоги) — тож без постійного диска її довелося б створювати
#  заново щоразу. Блок `disk:` нижче монтує Persistent Disk на 1 ГБ у
#  /var/data, а OSTVYTSYA_DB_PATH кладе базу саме туди. Диск створюється
#  порожнім; при першому старті панель сама створює файл бази, схему й
#  адміністратора — жодних ручних кроків.
#
#  Обмеження Render для сервісів із диском: лише платний план (Starter і
#  вище — free-план дисків не підтримує), рівно один інстанс і деплой із
#  короткою паузою замість zero-downtime. Диск оплачується окремо
#  (~$0.25/ГБ на місяць). Розмір можна лише збільшити, не зменшити.
#
#  Порт слухається за змінною PORT, яку Render задає сам, і на 0.0.0.0 —
#  інакше платформа не бачить сервіс («No open ports detected on 0.0.0.0»).
#
#  Секрети (sync: false) впиши в Render → сервіс → Environment:
#      OPENAI_API_KEY          — ключ OpenAI (веб-квест у браузері)
#      GEMINI_API_KEY          — лише якщо є персонажі з моделлю Google
#      OSTVYTSYA_WEB_PASSWORD  — початковий пароль адміністратора; читається
#                                ЛИШЕ при першому старті з порожньою базою,
#                                далі пароль живе в базі (/account)
#  OSTVYTSYA_WEB_SECRET Render згенерує сам (generateValue).
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: ostvytsya-web
    runtime: python
    # Диски доступні лише на платних планах; free не підходить.
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements-web.txt
    startCommand: python -m web
    healthCheckPath: /api/health
    # Постійний диск для бази панелі. Монтується в /var/data.
    disk:
      name: ostvytsya-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # База панелі (SQLite) — на постійному диску, а не в теці сервісу.
      - key: OSTVYTSYA_DB_PATH
        value: /var/data/ostvytsya.db
      # Персонажі редактора — у тій самій базі на диску.
      - key: OSTVYTSYA_STORAGE_BACKEND
        value: sqlite
      # Ключ підпису сесійної куки: Render згенерує випадковий і збереже його,
      # тож сесії живуть між перезапусками.
      - key: OSTVYTSYA_WEB_SECRET
        generateValue: true
      - key: OSTVYTSYA_WEB_USER
        value: admin
      # Секрети НЕ тримаємо у файлі — задай їх у панелі Render.
      - key: OSTVYTSYA_WEB_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2.1-mini

# ─────────────────────────────────────────────────────────────────────────────
#  Альтернатива без диска (не рекомендується): персонажі редактора в Render
#  Managed PostgreSQL. Статуси терміналів, перемоги й адміністратор усе одно
#  лишаться в SQLite і зникатимуть при деплої.
#    1. прибери блок `disk:` і OSTVYTSYA_DB_PATH, постав plan: free;
#    2. розкоментуй `databases:` і `DATABASE_URL` нижче;
#    3. OSTVYTSYA_STORAGE_BACKEND=postgresql.
# ─────────────────────────────────────────────────────────────────────────────
#
# databases:
#   - name: ostvytsya-db
#     plan: free
#     databaseName: ostvytsya
#     user: ostvytsya
#
# І в services → envVars додай:
#   - key: DATABASE_URL
#     fromDatabase:
#       name: ostvytsya-db
#       property: connectionString
